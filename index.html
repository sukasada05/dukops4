    <!-- ====== CSS CURSOR ====== -->
    <style>
        /* ============================================
           CURSOR DUKOPS - SIAP PAKAI
           Auto Detect Desktop & Android
           ============================================ */

        /* ---------- ROOT VARIABLES ---------- */
        :root {
            --cursor-path: 'cursors/';
            --cursor-default: var(--cursor-path) 'cursor1.cur', auto;
            --cursor-pointer: var(--cursor-path) 'cursor2.cur', pointer;
            --cursor-text: var(--cursor-path) 'cursor7.cur', text;
            --cursor-wait: var(--cursor-path) 'cursor3.ani', wait;
            --cursor-progress: var(--cursor-path) 'cursor4.ani', progress;
            --cursor-help: var(--cursor-path) 'cursor8.cur', help;
            --cursor-grab: var(--cursor-path) 'cursor5.ani', grab;
            --cursor-grabbing: var(--cursor-path) 'cursor6.ani', grabbing;
            --cursor-not-allowed: var(--cursor-path) 'cursor10.cur', not-allowed;
            --cursor-zoom-in: var(--cursor-path) 'cursor9.ani', zoom-in;
        }

        /* ========== DESKTOP CURSOR ========== */
        @media (hover: hover) and (pointer: fine) {
            * { cursor: var(--cursor-default); }
            
            a, a *, button, input[type="submit"], input[type="button"],
            input[type="reset"], select, [role="button"], [role="link"],
            [onclick], .nav-btn, .clickable, .tab {
                cursor: var(--cursor-pointer);
            }
            
            input[type="text"], input[type="password"], input[type="email"],
            input[type="number"], input[type="tel"], input[type="url"],
            input[type="search"], textarea, [contenteditable="true"] {
                cursor: var(--cursor-text);
            }
            
            .loading, .processing, .waiting, [data-loading="true"],
            .splash-progress-center {
                cursor: var(--cursor-wait);
            }
            
            .progress, [data-progress="true"] {
                cursor: var(--cursor-progress);
            }
            
            [title], [data-tooltip], .help, .tooltip-trigger {
                cursor: var(--cursor-help);
            }
            
            .draggable, .drag-handle, [data-drag="true"] {
                cursor: var(--cursor-grab);
            }
            
            .draggable:active, .drag-handle:active, [data-drag="true"]:active {
                cursor: var(--cursor-grabbing);
            }
            
            .disabled, [disabled], :disabled, [aria-disabled="true"],
            .not-allowed {
                cursor: var(--cursor-not-allowed);
            }
            
            .zoom-in, [data-zoom="in"] {
                cursor: var(--cursor-zoom-in);
            }
        }

        /* ========== ANDROID / TOUCH ========== */
        @media (hover: none) and (pointer: coarse) {
            * { cursor: default !important; }
            
            button, .btn, [onclick], .nav-btn, .tab {
                transition: transform 0.15s, opacity 0.15s;
                -webkit-tap-highlight-color: transparent;
                position: relative;
                overflow: hidden;
            }
            
            button:active, .btn:active, [onclick]:active,
            .nav-btn:active, .tab:active {
                transform: scale(0.93);
                opacity: 0.7;
            }
            
            button:active::after, .btn:active::after, [onclick]:active::after,
            .nav-btn:active::after, .tab:active::after {
                content: '';
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at center, rgba(255,255,255,0.2), transparent 70%);
                animation: touchRipple 0.6s ease-out;
                pointer-events: none;
            }
            
            @keyframes touchRipple {
                0% { transform: scale(0); opacity: 1; }
                100% { transform: scale(2.5); opacity: 0; }
            }
            
            a:active {
                opacity: 0.6;
                background: rgba(255, 255, 255, 0.1);
            }
            
            *:hover {
                transform: none !important;
                background: none !important;
            }
        }

        /* ========== FALLBACK ========== */
        @supports not (cursor: var(--cursor-default)) {
            * { cursor: auto; }
            a, button, [onclick] { cursor: pointer; }
            input, textarea { cursor: text; }
            .loading, .waiting { cursor: wait; }
            .disabled, [disabled] { cursor: not-allowed; }
        }

        /* ========== SEMBUNYIKAN TOOLTIP ========== */
        .indicator-tooltip { display: none !important; }
        .supabase-indicator { cursor: default; }
    </style>

    <!-- ====== JAVASCRIPT CURSOR ====== -->
    <script>
    /**
     * CURSOR DUKOPS - SIAP PAKAI
     * Auto Detect Desktop & Android
     */
    (function() {
        'use strict';
        
        // ========== DETEKSI ==========
        const isTouch = 'ontouchstart' in window || 
                        navigator.maxTouchPoints > 0 ||
                        window.matchMedia('(hover: none)').matches;
        
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isDesktop = !isTouch && !isAndroid;
        
        // ========== LOAD CURSOR (DESKTOP) ==========
        function loadCursors() {
            if (!isDesktop) return;
            
            const style = document.createElement('style');
            style.id = 'cursor-style';
            style.textContent = `
                :root {
                    --cursor-path: 'cursors/';
                    --cursor-default: url('cursors/cursor1.cur'), auto;
                    --cursor-pointer: url('cursors/cursor2.cur'), pointer;
                    --cursor-text: url('cursors/cursor7.cur'), text;
                    --cursor-wait: url('cursors/cursor3.ani'), wait;
                    --cursor-progress: url('cursors/cursor4.ani'), progress;
                    --cursor-help: url('cursors/cursor8.cur'), help;
                    --cursor-grab: url('cursors/cursor5.ani'), grab;
                    --cursor-grabbing: url('cursors/cursor6.ani'), grabbing;
                    --cursor-not-allowed: url('cursors/cursor10.cur'), not-allowed;
                    --cursor-zoom-in: url('cursors/cursor9.ani'), zoom-in;
                }
            `;
            document.head.appendChild(style);
        }
        
        // ========== TOUCH FEEDBACK (ANDROID) ==========
        function enableTouchFeedback() {
            if (!isTouch && !isAndroid) return;
            
            document.documentElement.classList.add('touch-device');
            
            // Haptic vibrate untuk Android
            if (isAndroid && navigator.vibrate) {
                document.addEventListener('touchstart', function(e) {
                    const target = e.target.closest('button, .btn, [onclick], a');
                    if (target) {
                        navigator.vibrate(10);
                    }
                }, { passive: true });
            }
        }
        
        // ========== FUNGSI GLOBAL ==========
        window.setCursor = function(element, type) {
            if (!isDesktop) return;
            
            const cursors = {
                'default': 'cursor1.cur',
                'pointer': 'cursor2.cur',
                'text': 'cursor7.cur',
                'wait': 'cursor3.ani',
                'progress': 'cursor4.ani',
                'help': 'cursor8.cur',
                'grab': 'cursor5.ani',
                'grabbing': 'cursor6.ani',
                'not-allowed': 'cursor10.cur',
                'zoom-in': 'cursor9.ani'
            };
            
            const el = typeof element === 'string' ? document.querySelector(element) : element;
            if (el && cursors[type]) {
                el.style.cursor = `url('cursors/${cursors[type]}'), ${type}`;
            }
        };
        
        window.resetCursor = function(element) {
            if (!isDesktop) return;
            const el = typeof element === 'string' ? document.querySelector(element) : element;
            if (el) {
                el.style.cursor = '';
            }
        };
        
        window.showLoading = function() {
            if (isDesktop) document.body.style.cursor = 'wait';
            document.body.classList.add('loading');
        };
        
        window.hideLoading = function() {
            if (isDesktop) document.body.style.cursor = '';
            document.body.classList.remove('loading');
        };
        
        // ========== INISIALISASI ==========
        function init() {
            loadCursors();
            enableTouchFeedback();
            
            // Export status
            window.isTouchDevice = isTouch;
            window.isAndroidDevice = isAndroid;
            window.isDesktopDevice = isDesktop;
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
    })();
    </script>

    <!-- ====== APP JS ====== -->
    <script src="app.js"></script>
    
    <script>
        // Ensure desa list loads after app.js is available
        (function(){
            try {
                const run = () => { try { if (typeof loadDesaList === 'function') loadDesaList().catch(()=>{}); } catch(e){} };
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else setTimeout(run, 50);
                try { window.addEventListener('focus', run); document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') run(); }); } catch(e) {}
            } catch (e) {}
        })();
    </script>
