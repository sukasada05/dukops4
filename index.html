<body>

    <script>
        (function() {
            // ============================================================
            //  KONFIGURASI
            // ============================================================
            const HANPANGAN_URL = "https://raw.githubusercontent.com/sukasada05/dukops4/main/data/hanpangan.txt";
            const PIKET_URL = "https://raw.githubusercontent.com/sukasada05/dukops4/main/data/piket.txt";
            const SUPABASE_URL = 'https://wausfsflcehizpuqdwbg.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdXNmc2ZsY2VoaXpwdXFkd2JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMTA3ODQsImV4cCI6MjA5ODY4Njc4NH0.2zF7iogzuTwWoQc451-uKxQdNN1C-qkB0O9Jvz1ZoI0';

            // Konfigurasi Telegram
            const TELEGRAM_TOKEN = '8676517308:AAGlUzkhP_iIMgx5Nd3ODg6fAXJGR0y2BwQ';
            const TELEGRAM_CHAT_ID = '-1003020813628';

            let supabaseClient = null;
            let isSupabaseConnected = false;
            let daftarNama = [];
            let currentHanpangan = "";
            let allJadwal = [];
            let isSaving = false;
            let isReloading = false;
            let lastReloadTime = 0;

            const bulanSelect = document.getElementById('bulanSelect');
            const bulanTahunTitle = document.getElementById('bulanTahunTitle');
            const previewContainer = document.getElementById('previewContainer');
            const toast = document.getElementById('toastMessage');
            const indicator = document.getElementById('supabaseIndicator');
            const totalHariSpan = document.getElementById('totalHari');

            // ============================================================
            //  NAMA HARI & BULAN INDONESIA
            // ============================================================
            const NAMA_HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const NAMA_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September",
                "Oktober", "November", "Desember"
            ];

            // ============================================================
            //  FORMAT TANGGAL
            // ============================================================
            function formatTanggalIndonesia(date) {
                const hari = NAMA_HARI[date.getDay()];
                const tanggal = date.getDate();
                const bulan = NAMA_BULAN[date.getMonth()];
                const tahun = date.getFullYear();
                return hari + ', ' + tanggal + ' ' + bulan + ' ' + tahun;
            }

            function formatTanggalDuaBaris(date) {
                const hari = NAMA_HARI[date.getDay()];
                const tanggal = date.getDate();
                const bulan = NAMA_BULAN[date.getMonth()];
                const tahun = date.getFullYear();
                return hari + ',\n' + tanggal + ' ' + bulan + ' ' + tahun;
            }

            function formatTanggalWA(date) {
                const hari = NAMA_HARI[date.getDay()];
                const tanggal = date.getDate();
                const bulan = NAMA_BULAN[date.getMonth()];
                const tahun = date.getFullYear();
                return hari + ', ' + tanggal + ' ' + bulan + ' ' + tahun;
            }

            function isWeekend(date) {
                const day = date.getDay();
                return day === 0 || day === 6;
            }

            // ============================================================
            //  UTILITY FUNCTIONS
            // ============================================================
            function updateIndicator(status) {
                const colors = { online: '#00aa00', offline: '#cc0000', checking: '#ffaa00' };
                indicator.style.background = colors[status] || '#ffaa00';
            }

            function fetchText(url) {
                return fetch(url + '?t=' + Date.now())
                    .then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.text();
                    })
                    .catch(() => null);
            }

            function showToast(msg, type = 'info') {
                toast.textContent = msg;
                toast.style.background = type === 'success' ? '#0066cc' : (type === 'error' ? '#cc0000' : '#000');
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // ============================================================
            //  LOAD DATA DARI GITHUB
            // ============================================================
            async function loadPiket() {
                try {
                    const data = await fetchText(PIKET_URL);
                    if (data) {
                        daftarNama = data.trim().split('\n').filter(l => l.trim()).map(n => n.trim());
                        console.log('✅ Load piket.txt success:', daftarNama.length, 'nama');
                        return true;
                    }
                    console.warn('⚠️ Gagal load piket.txt');
                    return false;
                } catch (e) {
                    console.error('❌ Error load piket.txt:', e);
                    return false;
                }
            }

            async function loadHanpangan() {
                try {
                    const data = await fetchText(HANPANGAN_URL);
                    let list = [];
                    if (data) {
                        list = data.trim().split('\n').filter(l => l.trim());
                    }

                    if (!list.length) {
                        console.warn('⚠️ Hanpangan.txt kosong atau tidak ditemukan');
                        return false;
                    }

                    const today = new Date();
                    const epochDays = Math.floor(today.getTime() / (24 * 60 * 60 * 1000));
                    const ref = new Date(2024, 0, 1);
                    const refEpoch = Math.floor(ref.getTime() / (24 * 60 * 60 * 1000));
                    let offset = (0 - refEpoch) % list.length;
                    if (offset < 0) offset += list.length;
                    let idx = (epochDays + offset) % list.length;
                    if (idx < 0) idx += list.length;
                    currentHanpangan = list[idx];
                    document.getElementById('runningTextJadwal').textContent = '🌾 JADWAL HANPANGAN HARI INI: ' +
                        currentHanpangan + ' 🌾';
                    console.log('✅ Hanpangan hari ini:', currentHanpangan);

            // ============================================================
            //  SUPABASE
            // ============================================================
            async function initSupabase() {
                updateIndicator('checking');
                try {
                    if (typeof supabase === 'undefined') {
                        console.error('❌ Supabase JS tidak ditemukan');
                        updateIndicator('offline');
                        return false;
                    }
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { error } = await supabaseClient.from('jadwal_piket').select('id').limit(1);
                    if (error) {
                        console.error('❌ Supabase connection error:', error);
                        updateIndicator('offline');
                        isSupabaseConnected = false;
                        return false;
                    }
                    isSupabaseConnected = true;
                    updateIndicator('online');
                    console.log('✅ Supabase connected');
                    await loadAllJadwal();
                    return true;
                } catch (e) {
                    console.error('❌ Supabase init error:', e);
                    updateIndicator('offline');
                    isSupabaseConnected = false;
                    return false;
                }
            }

            async function loadAllJadwal() {
                const now = Date.now();
                if (now - lastReloadTime < 1000) {
                    console.log('⏳ Skip reload, too frequent');
                    return;
                }
                lastReloadTime = now;

                if (isReloading) {
                    console.log('⏳ Already reloading');
                    return;
                }

                if (!supabaseClient || !isSupabaseConnected) {
                    previewContainer.innerHTML = '<div class="no-data">⚠️ Supabase tidak terhubung</div>';
                    return;
                }

                isReloading = true;
                try {
                    const { data, error } = await supabaseClient
                        .from('jadwal_piket')
                        .select('*')
                        .order('tanggal_jadwal', { ascending: true });
                    if (error) throw error;
                    allJadwal = data || [];
                    console.log('✅ Load jadwal success:', allJadwal.length, 'records');
                    renderPreview(allJadwal);
                } catch (e) {
                    console.error('❌ Gagal load jadwal:', e);
                    previewContainer.innerHTML = '<div class="no-data">❌ Gagal memuat data</div>';
                } finally {
                    isReloading = false;
                }
            }

            async function saveJadwal(tanggal, jenis, nama) {
                if (!supabaseClient || !isSupabaseConnected) {
                    showToast('⚠️ Supabase tidak terhubung!', 'error');
                    return false;
                }

                if (isSaving) return false;
                isSaving = true;

                try {
                    const { data: existing, error: findErr } = await supabaseClient
                        .from('jadwal_piket')
                        .select('id')
                        .eq('tanggal_jadwal', tanggal)
                        .eq('jenis', jenis)
                        .maybeSingle();
                    if (findErr) throw findErr;

                    let result;
                    if (existing) {
                        result = await supabaseClient
                            .from('jadwal_piket')
                            .update({
                                nama1: nama || null,
                                nama2: null,
                                tanggal_input: new Date().toISOString()
                            })
                            .eq('id', existing.id);
                    } else {
                        result = await supabaseClient
                            .from('jadwal_piket')
                            .insert([{
                                tanggal_jadwal: tanggal,
                                jenis: jenis,
                                nama1: nama || null,
                                nama2: null,
                                tanggal_input: new Date().toISOString()
                            }]);
                    }
                    if (result.error) throw result.error;

                    console.log('✅ Save success:', tanggal, jenis, nama);
                    showToast('✅ Data tersimpan!', 'success');

                    setTimeout(() => {
                        loadAllJadwal();
                    }, 300);

                    return true;
                } catch (e) {
                    console.error('❌ Gagal simpan:', e);
                    showToast('❌ Gagal simpan', 'error');
                    return false;
                } finally {
                    isSaving = false;
                }
            }

            // ============================================================
            //  BULAN
            // ============================================================
            function populateBulan() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                const allMonths = [];
                for (let year = currentYear - 2; year <= currentYear + 2; year++) {
                    for (let m = 0; m < 12; m++) {
                        allMonths.push({
                            value: year + '-' + String(m + 1).padStart(2, '0'),
                            label: NAMA_BULAN[m] + ' ' + year,
                            year: year,
                            month: m
                        });
                    }
                }

                const filtered = allMonths.filter(m => m.year >= 2026);

                bulanSelect.innerHTML = '';
                filtered.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.value;
                    opt.textContent = m.label;
                    bulanSelect.appendChild(opt);
                });

                const currentKey = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
                if (filtered.some(m => m.value === currentKey)) {
                    bulanSelect.value = currentKey;
                } else {
                    bulanSelect.value = '2026-01';
                }

                updateTotalHari();
            }

            function getBulanTahun() {
                const val = bulanSelect.value;
                const parts = val.split('-');
                return { bulan: parseInt(parts[1]) - 1, tahun: parseInt(parts[0]) };
            }

            function updateTitle() {
                const { bulan, tahun } = getBulanTahun();
                bulanTahunTitle.textContent = NAMA_BULAN[bulan] + ' ' + tahun;
            }

            function updateTotalHari() {
                const { bulan, tahun } = getBulanTahun();
                const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();
                totalHariSpan.textContent = 'Total: ' + daysInMonth + ' hari';
            }

            // ============================================================
            //  CREATE CUSTOM DROPDOWN
            // ============================================================
            function createCustomDropdown(tanggal, jenis, currentValue) {
                const wrapper = document.createElement('span');
                wrapper.className = 'custom-dropdown-wrapper';
                wrapper.style.display = 'inline-block';
                wrapper.style.width = '100%';
                wrapper.style.position = 'relative';

                const display = document.createElement('span');
                display.className = 'custom-dropdown-display';
                display.dataset.tanggal = tanggal;
                display.dataset.jenis = jenis;
                display.style.display = 'inline-block';
                display.style.width = '100%';
                display.style.whiteSpace = 'pre-line';
                display.style.lineHeight = '1.6';
                display.style.textAlign = 'left';
                display.style.verticalAlign = 'top';

                const menu = document.createElement('div');
                menu.className = 'custom-dropdown-menu';

                const header = document.createElement('div');
                header.className = 'menu-header';
                const title = document.createElement('h2');
                title.textContent = '📋 Pilih Nama';
                title.style.textAlign = 'left';
                header.appendChild(title);
                menu.appendChild(header);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';
                menu.appendChild(optionsGrid);

                const footer = document.createElement('div');
                footer.className = 'menu-footer';
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'btn-confirm';
                confirmBtn.textContent = '✅ OK';
                footer.appendChild(confirmBtn);
                menu.appendChild(footer);

                wrapper.appendChild(display);
                wrapper.appendChild(menu);

                let selectedNames = [];
                if (currentValue && currentValue !== '') {
                    selectedNames = currentValue.split(', ').filter(n => n.trim());
                }

                let isOpen = false;

                function formatDisplay() {
                    if (selectedNames.length === 0) return '— Pilih —';
                    return selectedNames.map((name, i) => (i + 1) + '. ' + name).join('\n');
                }

                function renderOptions() {
                    let html = '';
                    if (daftarNama.length === 0) {
                        html = '<div class="no-result">⚠️ Nama tidak ditemukan. Cek koneksi internet.</div>';
                    } else {
                        daftarNama.forEach(n => {
                            const isSelected = selectedNames.includes(n);
                            let num = '';
                            if (isSelected) {
                                num = (selectedNames.indexOf(n) + 1);
                            }
                            html += `
                                <div class="option-item ${isSelected ? 'selected' : ''}" data-name="${n}">
                                    <span class="num-icon">${num}</span>
                                    ${n}
                                </div>
                            `;
                        });
                    }
                    optionsGrid.innerHTML = html;

                    optionsGrid.querySelectorAll('.option-item').forEach(el => {
                        el.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const name = this.dataset.name;
                            const idx = selectedNames.indexOf(name);
                            if (idx > -1) {
                                selectedNames.splice(idx, 1);
                                this.classList.remove('selected');
                            } else {
                                selectedNames.push(name);
                                this.classList.add('selected');
                            }
                            updateDisplay();
                            renderOptions();
                        });
                    });
                }

                function updateDisplay() {
                    display.innerHTML = '';
                    if (selectedNames.length === 0) {
                        const ph = document.createElement('span');
                        ph.className = 'placeholder';
                        ph.textContent = '— Pilih —';
                        ph.style.textAlign = 'left';
                        display.appendChild(ph);
                    } else {
                        const formatted = document.createTextNode(formatDisplay());
                        display.appendChild(formatted);
                    }
                }

                function openMenu() {
                    if (daftarNama.length === 0) {
                        showToast('⚠️ Daftar nama belum dimuat. Cek koneksi.', 'error');
                        return;
                    }
                    menu.classList.add('open');
                    isOpen = true;
                    renderOptions();
                }

                function closeMenu() {
                    menu.classList.remove('open');
                    isOpen = false;
                }

                display.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isOpen) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                });

                confirmBtn.addEventListener('click', function() {
                    closeMenu();
                    const finalValue = selectedNames.join(', ');
                    saveJadwal(tanggal, jenis, finalValue);
                });

                document.addEventListener('click', function(e) {
                    if (!wrapper.contains(e.target) && !menu.contains(e.target)) {
                        closeMenu();
                    }
                });

                renderOptions();
                updateDisplay();

                return wrapper;
            }

            // ============================================================
            //  RENDER PREVIEW
            // ============================================================
            function renderPreview(data) {
                const { bulan, tahun } = getBulanTahun();
                updateTitle();
                updateTotalHari();

                const filtered = data.filter(item => {
                    const parts = item.tanggal_jadwal.split('-');
                    const itemBulan = parseInt(parts[1]) - 1;
                    const itemTahun = parseInt(parts[0]);
                    return itemBulan === bulan && itemTahun === tahun;
                });

                const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();
                const allDates = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const key = tahun + '-' + String(bulan + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    allDates.push(key);
                }

                const today = new Date();
                const isCurrentMonth = (tahun === today.getFullYear() && bulan === today.getMonth());

                let sortedDates = [];
                if (isCurrentMonth) {
                    const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(
                        today.getDate()).padStart(2, '0');
                    const fromToday = [];
                    const beforeToday = [];
                    allDates.forEach(dateKey => {
                        if (dateKey >= todayStr) {
                            fromToday.push(dateKey);
                        } else {
                            beforeToday.push(dateKey);
                        }
                    });
                    sortedDates = fromToday.concat(beforeToday);
                } else {
                    sortedDates = allDates.slice();
                }

                const grouped = {};
                filtered.forEach(item => {
                    const key = item.tanggal_jadwal;
                    if (!grouped[key]) {
                        grouped[key] = { koramil: '', kediaman: '', makodim: '' };
                    }
                    if (item.jenis === 'koramil_hari_ini') {
                        grouped[key].koramil = item.nama1 || '';
                    } else if (item.jenis === 'kediaman_hari_ini') {
                        grouped[key].kediaman = item.nama1 || '';
                    } else if (item.jenis === 'makodim_hari_ini') {
                        grouped[key].makodim = item.nama1 || '';
                    }
                });

                const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(
                    today.getDate()).padStart(2, '0');

                let html = `
                    <div class="table-wrapper">
                        <table class="excel-table">
                            <thead>
                                <tr>
                                    <th>NO</th>
                                    <th>TANGGAL</th>
                                    <th>KORAMIL</th>
                                    <th>KEDIAMAN</th>
                                    <th>MAKODIM</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                sortedDates.forEach((dateKey, index) => {
                    const entry = grouped[dateKey] || { koramil: '', kediaman: '', makodim: '' };
                    const parts = dateKey.split('-');
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    const dateStr = formatTanggalDuaBaris(d);
                    const isToday = (dateKey === todayStr);
                    const isWeekendDay = isWeekend(d);
                    let rowClass = '';
                    if (isToday) rowClass += ' row-today';
                    if (isWeekendDay) rowClass += ' row-weekend';
                    html += `
                        <tr class="${rowClass}" data-tanggal="${dateKey}">
                            <td style="font-weight:700;text-align:left;vertical-align:top;">${index+1}</td>
                            <td style="text-align:left;vertical-align:top;">${dateStr}</td>
                            <td data-jenis="koramil_hari_ini" style="text-align:left;vertical-align:top;"></td>
                            <td data-jenis="kediaman_hari_ini" style="text-align:left;vertical-align:top;"></td>
                            <td data-jenis="makodim_hari_ini" style="text-align:left;vertical-align:top;"></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                previewContainer.innerHTML = html;

                const rows = previewContainer.querySelectorAll('tr[data-tanggal]');
                rows.forEach(row => {
                    const tanggal = row.dataset.tanggal;
                    const cells = row.querySelectorAll('td[data-jenis]');
                    cells.forEach(cell => {
                        const jenis = cell.dataset.jenis;
                        const key = jenis.replace('_hari_ini', '');
                        const currentValue = (grouped[tanggal] && grouped[tanggal][key]) || '';
                        const dropdown = createCustomDropdown(tanggal, jenis, currentValue);
                        cell.innerHTML = '';
                        cell.style.padding = '2px 4px';
                        cell.style.background = 'transparent';
                        cell.style.textAlign = 'left';
                        cell.style.verticalAlign = 'top';
                        cell.appendChild(dropdown);
                    });
                });
            }

                    function formatNamaWA(namaStr) {
                        if (!namaStr) return '';
                        const names = namaStr.split(',').map(s => s.trim()).filter(s => s);
                        if (names.length === 0) return '';
                        return names.map((n, i) => '   ' + (i + 1) + '. ' + n).join('\n');
                    }

                    const tglHariIni = formatTanggalWA(today);
                    const tglBesok = formatTanggalWA(tomorrow);

                    const koramilHariIni = grouped[todayStr]?.koramil || '';
                    const koramilBesok = grouped[tomorrowStr]?.koramil || '';
                    const kediamanHariIni = grouped[todayStr]?.kediaman || '';
                    const kediamanBesok = grouped[tomorrowStr]?.kediaman || '';
                    const makodimHariIni = grouped[todayStr]?.makodim || '';
                    const makodimBesok = grouped[tomorrowStr]?.makodim || '';

                    // Kumpulkan bagian yang memiliki data
                    let sections = [];
                    let letter = 'A';

                    function addSection(date, names, type) {
                        if (names && names.trim() !== '') {
                            let label = letter + '.';
                            let title = date;
                            if (type) title += ' (' + type + ')';
                            sections.push({ label, title, names });
                            letter = String.fromCharCode(letter.charCodeAt(0) + 1);
                        }
                    }

                    // Urutan sesuai contoh
                    addSection(tglHariIni, koramilHariIni, '');
                    addSection(tglBesok, koramilBesok, '');
                    addSection(tglHariIni, kediamanHariIni, 'Kediaman');
                    addSection(tglBesok, kediamanBesok, 'Kediaman');
                    addSection(tglHariIni, makodimHariIni, 'Makodim');
                    addSection(tglBesok, makodimBesok, 'Makodim');

                    if (sections.length === 0) {
                        showToast('⚠️ Tidak ada jadwal untuk hari ini dan besok.', 'error');
                        return;
                    }

                    let pesan = '';
                    pesan += '_____________________________\n';
                    pesan += '*KORAMIL 1609-05/SUKASADA*\n';
                    pesan += '    *JADWAL DINAS DALAM*\n';
                    pesan += '_____________________________\n\n';

                    sections.forEach((sec, idx) => {
                        pesan += sec.label + ' ' + sec.title + '\n';
                        pesan += formatNamaWA(sec.names) + '\n';
                        if (idx < sections.length - 1) {
                            pesan += '\n';
                        }
                    });

                    pesan += '\n*🌾Jadwal Hanpangan hari ini :* ' + currentHanpangan + '\n\n';
                    pesan += '*Demikian MMP.*';

                    // Kirim ke Telegram
                    await sendToTelegram(pesan);

                    // Buka WhatsApp
                    const encoded = encodeURIComponent(pesan);
                    const waUrl = 'https://wa.me/?text=' + encoded;
                    window.open(waUrl, '_blank');

                    showToast('✅ Pesan WhatsApp siap dikirim!', 'success');

                } catch (e) {
                    console.error('❌ Error kirim WhatsApp:', e);
                    showToast('❌ Gagal menyiapkan pesan WhatsApp', 'error');
                }
            }

            // ============================================================
            //  AUTO-REFRESH
            // ============================================================
            let refreshInterval = null;

            function startAutoRefresh() {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
                refreshInterval = setInterval(() => {
                    if (isSupabaseConnected && !isSaving && !isReloading) {
                        loadAllJadwal();
                    }
                }, 30000);
            }

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                console.log('🚀 Initializing...');

                const [piketLoaded, hanpanganLoaded] = await Promise.all([
                    loadPiket(),
                    loadHanpangan()
                ]);

                if (!piketLoaded) {
                    showToast('⚠️ Gagal load daftar nama dari GitHub', 'error');
                }
                if (!hanpanganLoaded) {
                    showToast('⚠️ Gagal load hanpangan dari GitHub', 'error');
                }

                populateBulan();
                await initSupabase();

                bulanSelect.addEventListener('change', function() {
                    loadAllJadwal();
                });

                document.getElementById('btnCetak').addEventListener('click', function() {
                    cetakJadwal();
                });

                document.getElementById('btnWa').addEventListener('click', function() {
                    kirimWhatsApp();
                });

                startAutoRefresh();

                console.log('✅ Initialization complete');
                console.log('📊 Daftar nama:', daftarNama.length, 'orang');
                console.log('📊 Supabase:', isSupabaseConnected ? 'Connected' : 'Disconnected');
            }

            document.addEventListener('DOMContentLoaded', init);

            window.__app = {
                loadAllJadwal,
                saveJadwal,
                daftarNama,
                allJadwal,
                isSupabaseConnected,
                reload: loadAllJadwal,
                cetak: cetakJadwal,
                kirimWhatsApp: kirimWhatsApp,
                sendToTelegram: sendToTelegram
            };

        })();
    </script>

</body>
</html>
