<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUKOPS - Form Laporan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: transparent;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(10, 26, 42, 0.8);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        label { display: block; margin-bottom: 5px; color: #4dff4d; font-weight: bold; }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #4dff4d;
            background: #1a2a1f;
            color: #e6ffe6;
            font-size: 14px;
            outline: none;
        }
        button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit { background: #2a4a2a; color: #ccc; width: 100%; margin-bottom: 10px; }
        .btn-reset { background: #4a2a2a; color: #ffaaaa; width: 100%; margin-bottom: 10px; }
        .btn-attendance { background: #1a3a6a; color: #ffcc00; width: 100%; }
        .preview-box { margin-top: 8px; padding: 8px; background: #0f1a12; border-radius: 8px; font-size: 12px; display: none; }
        canvas { width: 100%; background: #0f1a12; border-radius: 10px; margin-bottom: 15px; border: 1px solid #4dff4d; display: none; }
        .narasi-wrapper { position: relative; }
        .ai-icon-corner {
            position: absolute; bottom: 12px; right: 12px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-radius: 50%; width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }
        .ai-icon-corner i { color: white; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <label><i class="fas fa-village"></i> Pilih Desa:</label>
        <select id="selectDesa" onchange="loadSelectedDesa()">
            <option value="">-- Pilih Desa --</option>
        </select>
        <div id="loadingDesa" style="display: none;"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
        <div id="previewDesa" class="preview-box"></div>

        <div id="loadingKoordinat" style="font-size: 12px; color: #ffaa00;"><i class="fas fa-spinner fa-spin"></i> Memuat koordinat...</div>
        <div id="previewKordinat" class="preview-box"></div>

        <label><i class="fas fa-camera"></i> Foto Kegiatan:</label>
        <input type="file" id="gambar" accept="image/*" onchange="previewImage()">
        <div id="previewGambar" class="preview-box"></div>

        <label><i class="fas fa-calendar-alt"></i> Tanggal & Waktu:</label>
        <input type="datetime-local" id="tanggalWaktu" onchange="updateDatePreview()">
        <div id="previewTanggal" class="preview-box"></div>

        <label><i class="fas fa-file-alt"></i> Narasi Kegiatan:</label>
        <div class="narasi-wrapper">
            <textarea id="narasi" rows="5" placeholder="Masukkan narasi kegiatan..." oninput="checkInputCompletion()"></textarea>
            <div class="ai-icon-corner" id="aiTemplateBtn"><i class="fas fa-robot"></i></div>
        </div>

        <canvas id="canvas"></canvas>

        <button id="submitBtn" class="btn-submit" onclick="processSubmission()" disabled><i class="fas fa-download"></i> DOWNLOAD & KIRIM</button>
        <button id="resetBtn" class="btn-reset" onclick="resetAll()"><i class="fas fa-redo"></i> Reset Data</button>
        <button id="showAttendanceBtn" class="btn-attendance" onclick="showAttendance()"><i class="fas fa-chart-bar"></i> CEK LAPORAN</button>

        <div id="attendancePanel" style="display: none; margin-top: 15px;"></div>
        <div id="logTerkirim" style="font-size: 11px; color: #aaa; text-align: center; margin-top: 10px;"></div>
    </div>

    <script>
        // Ambil username dari parent window
        let currentUser = 'Guest';
        
        function getUsernameFromParent() {
            try {
                if (window.parent && window.parent.document) {
                    const nameElem = window.parent.document.getElementById('desaProfileNameHeader');
                    if (nameElem && nameElem.innerText !== 'Pilih Desa') {
                        currentUser = nameElem.innerText;
                    }
                }
            } catch(e) {}
            return currentUser;
        }
        
        // Terima pesan dari parent
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'updateUsername') {
                currentUser = event.data.username || 'Guest';
                const selectDesa = document.getElementById('selectDesa');
                if (selectDesa && currentUser !== 'Guest') {
                    selectDesa.value = currentUser;
                    loadSelectedDesa();
                }
            }
        });
        
        // Load data desa
        async function loadDesaList() {
            try {
                const res = await fetch('data/desa-list.json?t=' + Date.now());
                const data = await res.json();
                const desaList = data.desaList || [];
                const selectDesa = document.getElementById('selectDesa');
                selectDesa.innerHTML = '<option value="">-- Pilih Desa/Kelurahan --</option>' + desaList.map(d => `<option value="${d}">${d}</option>`).join('');
                
                const username = getUsernameFromParent();
                if (username && username !== 'Guest') {
                    selectDesa.value = username;
                    loadSelectedDesa();
                }
            } catch(e) { console.error('Gagal load desa:', e); }
        }
        
        window.loadSelectedDesa = function() {
            const selectDesa = document.getElementById('selectDesa');
            const desa = selectDesa.value;
            if (!desa) return;
            
            // Simulasi koordinat
            const loadingCoord = document.getElementById('loadingKoordinat');
            const previewCoord = document.getElementById('previewKordinat');
            if (loadingCoord) loadingCoord.style.display = 'block';
            
            setTimeout(() => {
                if (previewCoord) {
                    previewCoord.innerHTML = `<i class="fas fa-map-marker-alt"></i> Koordinat: -8.1155°, 115.0885° (${desa})`;
                    previewCoord.style.display = 'block';
                }
                if (loadingCoord) loadingCoord.style.display = 'none';
            }, 500);
        };
        
        window.previewImage = function() {
            const file = document.getElementById('gambar').files[0];
            const preview = document.getElementById('previewGambar');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%; max-height:150px; border-radius:8px;">`;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        };
        
        window.updateDatePreview = function() {
            const tanggal = document.getElementById('tanggalWaktu').value;
            const preview = document.getElementById('previewTanggal');
            if (tanggal) {
                const date = new Date(tanggal);
                preview.innerHTML = `<i class="fas fa-calendar-alt"></i> ${date.toLocaleDateString('id-ID', { weekday:'long', year:'numeric', month:'long', day:'numeric' })} pukul ${date.toLocaleTimeString()}`;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        };
        
        window.checkInputCompletion = function() {
            const narasi = document.getElementById('narasi').value.trim();
            const gambar = document.getElementById('gambar').files[0];
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = !(narasi && gambar);
        };
        
        window.processSubmission = function() {
            alert('Laporan berhasil diproses!');
        };
        
        window.resetAll = function() {
            document.getElementById('narasi').value = '';
            document.getElementById('gambar').value = '';
            document.getElementById('tanggalWaktu').value = '';
            document.getElementById('previewGambar').style.display = 'none';
            document.getElementById('previewTanggal').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
        };
        
        window.showAttendance = function() {
            const panel = document.getElementById('attendancePanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            panel.innerHTML = '<div style="background:#0f1a12; padding:12px; border-radius:8px;"><h3 style="color:#4dff4d;">LAPORAN TERKIRIM</h3><p>Data laporan akan muncul di sini</p></div>';
        };
        
        // Inisialisasi
        loadDesaList();
        
        // AI Template (sederhana)
        document.getElementById('aiTemplateBtn').onclick = () => {
            const desa = document.getElementById('selectDesa').value;
            const template = `Melaksanakan kegiatan pembinaan wilayah di ${desa} dalam rangka mewujudkan keamanan dan ketertiban masyarakat. Kegiatan berjalan lancar dan kondusif.`;
            document.getElementById('narasi').value = template;
            checkInputCompletion();
        };
    </script>
</body>
</html>
