<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABSENSI DUKOPS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: transparent;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(10, 26, 42, 0.8);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .absen-card {
            background: rgba(0,40,0,0.7);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #4dff4d;
        }
        .form-group { margin-bottom: 15px; }
        label { color: #4dff4d; font-weight: bold; display: block; margin-bottom: 5px; }
        select {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #4dff4d; background: #1a2a1f; color: #e6ffe6;
        }
        .absen-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .absen-stat-card {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .absen-stat-value { font-size: 1.5rem; font-weight: bold; }
        .absen-stat-label { font-size: 0.7rem; color: #aaa; }
        .absen-progress-bar {
            background: #333;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .absen-progress-fill {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            height: 100%;
            width: 0%;
            border-radius: 10px;
        }
        .absen-desa-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .absen-desa-item {
            padding: 10px 0;
            border-bottom: 1px solid #2a4a2a;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .absen-desa-name { flex: 2; font-size: 0.8rem; font-weight: 600; }
        .absen-desa-stats { min-width: 50px; font-size: 0.7rem; text-align: center; }
        .absen-status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: bold;
            min-width: 70px;
            text-align: center;
        }
        .absen-status-lengkap { background: #1b5e20; color: #a5d6a7; }
        .absen-status-belum-lengkap { background: #e65100; color: #ffcc80; }
        .absen-status-belum { background: #b71c1c; color: #ef9a9a; }
        .absen-btn {
            background: #2a4a2a;
            color: #e6ffe6;
            border: 1px solid #4dff4d;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .absen-info-text { text-align: center; font-size: 0.6rem; margin-top: 10px; color: #888; }
        .absen-loading { text-align: center; padding: 20px; color: #4dff4d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="absen-card">
            <div class="form-group">
                <label>📅 TAHUN</label>
                <select id="absenTahunSelect"><option>Memuat...</option></select>
            </div>
            <div class="form-group">
                <label>📆 BULAN</label>
                <select id="absenBulanSelect" disabled><option>Pilih tahun dulu</option></select>
            </div>
        </div>
        <div id="absenResultContainer"></div>
        <div class="absen-info-text">✨ Tap desa untuk detail | Data tersimpan offline</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcKBFM8Mm0A8e_hWfl48uEUuDhlmxK8okgXF4M-102HLEuROZPN9YZlpmKnkRo8b_SKA/exec';
        let currentData = null;
        const tahunSelect = document.getElementById('absenTahunSelect');
        const bulanSelect = document.getElementById('absenBulanSelect');
        const resultContainer = document.getElementById('absenResultContainer');
        
        async function loadYears() {
            if (!tahunSelect) return;
            tahunSelect.innerHTML = '<option>Memuat...</option>';
            try {
                const res = await fetch(SCRIPT_URL + '?action=getYears');
                const years = await res.json();
                tahunSelect.innerHTML = '<option value="">-- Pilih Tahun --</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
                tahunSelect.onchange = () => { if (tahunSelect.value) loadMonths(tahunSelect.value); };
            } catch(e) { tahunSelect.innerHTML = '<option>Gagal</option>'; }
        }
        
        async function loadMonths(tahun) {
            bulanSelect.disabled = true;
            bulanSelect.innerHTML = '<option>Memuat...</option>';
            try {
                const res = await fetch(SCRIPT_URL + '?action=getMonths&tahun=' + encodeURIComponent(tahun));
                const months = await res.json();
                bulanSelect.innerHTML = '<option value="">-- Pilih Bulan --</option>' + months.map(m => `<option value="${m.num}">${m.name}</option>`).join('');
                bulanSelect.disabled = false;
                bulanSelect.onchange = () => { if (bulanSelect.value) loadData(tahun, bulanSelect.value); };
            } catch(e) { bulanSelect.innerHTML = '<option>Gagal</option>'; bulanSelect.disabled = false; }
        }
        
        async function loadData(tahun, bulan) {
            resultContainer.innerHTML = '<div class="absen-loading">Memuat...</div>';
            try {
                const res = await fetch(SCRIPT_URL + '?action=getData&tahun=' + encodeURIComponent(tahun) + '&bulan=' + encodeURIComponent(bulan));
                const data = await res.json();
                currentData = data;
                displayData(data);
            } catch(e) { resultContainer.innerHTML = '<div class="absen-card">Gagal memuat</div>'; }
        }
        
        function displayData(data) {
            let persen = Math.round((data.desa_lengkap / data.total_desa) * 100);
            let html = '<div class="absen-card"><div class="absen-stats-grid">';
            html += `<div class="absen-stat-card"><div class="absen-stat-value">${data.total_desa}</div><div class="absen-stat-label">DESA</div></div>`;
            html += `<div class="absen-stat-card"><div class="absen-stat-value">${data.desa_lengkap}</div><div class="absen-stat-label">LENGKAP</div></div>`;
            html += `<div class="absen-stat-card"><div class="absen-stat-value">${data.desa_belum_lengkap}</div><div class="absen-stat-label">BL</div></div>`;
            html += `<div class="absen-stat-card"><div class="absen-stat-value">${data.desa_belum}</div><div class="absen-stat-label">BELUM</div></div>`;
            html += '</div><div class="absen-progress-bar"><div class="absen-progress-fill" style="width:' + persen + '%"></div></div>';
            html += '<div style="margin-top:10px;"><b>📋 DAFTAR DESA</b></div><div class="absen-desa-list">';
            data.details.forEach(d => {
                let statusClass = 'absen-status-belum', statusText = 'BELUM';
                if (d.status === 'LENGKAP') { statusClass = 'absen-status-lengkap'; statusText = 'LENGKAP'; }
                else if (d.status === 'BELUM_LENGKAP') { statusClass = 'absen-status-belum-lengkap'; statusText = 'BL'; }
                html += `<div class="absen-desa-item" onclick="alert('${d.nama}\n${d.jumlah_file}/9 (${d.persentase}%)')">
                            <div class="absen-desa-name">${d.nama}</div>
                            <div class="absen-desa-stats">${d.jumlah_file}/9</div>
                            <div class="absen-status-badge ${statusClass}">${statusText}</div>
                         </div>`;
            });
            html += '</div><button class="absen-btn" onclick="shareAsPNG()">📸 DOWNLOAD ABSEN</button></div>';
            resultContainer.innerHTML = html;
        }
        
        window.shareAsPNG = async function() {
            if (!currentData) return;
            const area = document.createElement('div');
            area.style.position = 'fixed';
            area.style.left = '-9999px';
            area.style.top = '0';
            area.innerHTML = '<div style="background:white; padding:16px; border-radius:16px;"><h2 style="color:#0d47a1;">📊 ABSENSI DUKOPS</h2>' + resultContainer.innerHTML + '</div>';
            document.body.appendChild(area);
            try {
                const canvas = await html2canvas(area, { scale: 2 });
                const link = document.createElement('a');
                link.download = 'Absensi.png';
                link.href = canvas.toDataURL();
                link.click();
            } catch(e) { console.error(e); }
            document.body.removeChild(area);
        };
        
        loadYears();
    </script>
</body>
</html>
